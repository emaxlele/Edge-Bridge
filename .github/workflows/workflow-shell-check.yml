name: Workflow Shell Usage Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shell-check:
    name: Check workflows for bash usage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if workflows use bash constructs without 'shell: bash'
        # This script uses bash-specific features (process substitution); ensure bash is used
        shell: bash
        run: |
          set -euo pipefail
          files=$(ls .github/workflows/*.yml || true)
          # Exclude this workflow file from the scan to avoid self-failure
          files=$(echo "$files" | grep -v 'workflow-shell-check.yml' || true)
          if [ -z "$files" ]; then
            echo "No workflow files to check"
            exit 0
          fi

          fail=0
          for f in $files; do
            # Find lines that use bash-style 'for ...; do' constructs
            while IFS= read -r match; do
              lineno=${match%%:*}
              line=${match#*:}
              # Look back a generous number of lines to find a 'shell: bash' declaration in the same step
               start=$((lineno-40))
              if [ $start -lt 1 ]; then start=1; fi
              if ! sed -n "${start},${lineno}p" "$f" | grep -Eq 'shell:\s*bash'; then
                echo "ERROR: $f contains bash-style line $lineno: $line"
                echo "  Missing 'shell: bash' in the enclosing step (checked lines $start-$lineno)"
                fail=1
              fi
            done < <(grep -nE 'for [^;]+; do' "$f" || true)
          done

          if [ "$fail" -eq 1 ]; then
            echo "WARNING: One or more workflow files use bash constructs without 'shell: bash'."
            echo "Please add 'shell: bash' to the step that contains the run block."
            # Do not fail the workflow to avoid blocking merges while fixes are applied.
            # The check reports issues as warnings; future runs can be tightened.
          fi
